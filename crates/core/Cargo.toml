[package]
name = "mentalese-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libloading = "0.9.1"
lingua = { version = "1.8.0", default-features = false, features = ["english", "russian", "chinese", "japanese", "korean", "german", "french", "spanish", "portuguese", "italian"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.18.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Media_Audio",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.62.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
objc2 = "0.6.5"
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSUUID", "NSValue"] }
