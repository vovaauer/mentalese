[project]
name = "mentalese"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "lingua-language-detector>=2.2.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "requests>=2.34.2",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[tool.uv]
python-preference = "only-managed"

[project.scripts]
mentalese = "mentalese.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
